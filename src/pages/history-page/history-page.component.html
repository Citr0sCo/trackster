<div class="history-page-component">
    <div class="container">
        <div class="o-grid o-grid--static page-header">
            <div class="o-grid__col" style="display: flex; align-items: center;">
                <h3 class="u-mb-0"><i class="fa fa-history"></i> History</h3>
            </div>
            <div class="o-grid__col o-grid__col--fixed">
                <button class="o-btn page-refresh" type="button" aria-label="Refresh history" (click)="bustCache()">
                    <i class="fa fa-sync" [ngClass]="{'fa-spin': mediaLoading}" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        @if (media != null && keys.length > 0) {
            <div class="o-grid o-grid--space-between o-grid--row">
                @for (key of visibleKeys; track key) {
                    <div style="margin-top:15px;">
                        {{ key | date:'MMMM d, y' }}
                    </div>
                    <div class="o-grid o-grid--static movie-poster-wrapper">
                        @for (mediaItem of media[key]; track mediaItem) {
                            <div class="o-grid__col o-grid__col--fixed">
                                <media-poster [media]="mediaItem"></media-poster>
                            </div>
                        }
                    </div>
                }
            </div>
        } @else if (mediaLoading) {
            Media loading...
        } @else {
            No media to show...
        }
    </div>
</div>
